[package]
name = "spotter"
version = "0.1.0"
edition = "2024"
description = "Fast file search for Windows that skips dependency and build folders"
license = "MIT"
repository = "https://github.com/MattGyverLee/Spotter"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.37.0"
egui_extras = "0.37.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
